<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhishRadar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #09090f;
      --card:    #0f0f1a;
      --input:   #13131f;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8e8f0;
      --muted:   #6b6b85;
      --dim:     #3a3a52;
      --accent:  #6366f1;
      --safe:    #10b981;
      --warn:    #f59e0b;
      --danger:  #ef4444;
      --mono:    'JetBrains Mono', 'Courier New', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      padding: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-icon svg { width: 14px; height: 14px; }
    .topbar h1 {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      flex: 1;
    }
    .topbar-version {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--dim);
    }

    /* ── BODY ── */
    .body { padding: 16px; }

    /* ── URL DISPLAY ── */
    .url-preview {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .url-preview-label {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 4px;
    }
    .url-preview-text {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.4;
    }

    /* ── SCAN BUTTON ── */
    .scan-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .scan-btn:hover { background: #818cf8; }
    .scan-btn:active { transform: scale(0.97); }
    .scan-btn:disabled { opacity: 0.5; pointer-events: none; }
    .scan-btn svg { width: 16px; height: 16px; }

    /* ── STATUS AREA ── */
    .status-area { margin-top: 14px; }

    .status-idle {
      text-align: center;
      padding: 16px;
      color: var(--dim);
      font-size: 0.8rem;
    }

    /* verdict box */
    .verdict {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid transparent;
    }
    .verdict.safe   { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); }
    .verdict.medium { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
    .verdict.high   { background: rgba(239,68,68,0.08);  border-color: rgba(239,68,68,0.2); }

    .verdict-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .verdict-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .safe   .verdict-dot { background: var(--safe); }
    .medium .verdict-dot { background: var(--warn); }
    .high   .verdict-dot { background: var(--danger); }

    .verdict-label { font-size: 0.95rem; font-weight: 700; flex: 1; }
    .safe   .verdict-label { color: var(--safe); }
    .medium .verdict-label { color: var(--warn); }
    .high   .verdict-label { color: var(--danger); }

    .verdict-score {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 500;
    }
    .safe   .verdict-score { color: var(--safe); }
    .medium .verdict-score { color: var(--warn); }
    .high   .verdict-score { color: var(--danger); }

    /* progress bar */
    .mini-bar-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .mini-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .safe   .mini-bar-fill { background: var(--safe); }
    .medium .mini-bar-fill { background: var(--warn); }
    .high   .mini-bar-fill { background: var(--danger); }

    /* reasons */
    .reasons { display: flex; flex-direction: column; gap: 6px; }
    .reason {
      font-size: 0.75rem;
      line-height: 1.45;
      color: var(--muted);
      display: flex;
      gap: 6px;
    }
    .reason::before {
      content: '–';
      flex-shrink: 0;
      color: var(--dim);
    }

    /* ── ERROR ── */
    .error-box {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.8rem;
      color: #fca5a5;
    }

    /* ── LOADING ── */
    .loading-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon { animation: spin 0.8s linear infinite; width: 16px; height: 16px; flex-shrink: 0; }

    /* ── OPEN IN FULL ── */
    .open-full-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      text-align: center;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .open-full-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── FOOTER ── */
    .popup-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--dim);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>PhishRadar</h1>
    <span class="topbar-version">v1.0</span>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Current URL preview -->
    <div class="url-preview">
      <div class="url-preview-label">Current page</div>
      <div class="url-preview-text" id="url-display">Loading URL…</div>
    </div>

    <!-- Scan button -->
    <button class="scan-btn" id="checkBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Scan this page
    </button>

    <!-- Status area -->
    <div class="status-area" id="statusArea">
      <div class="status-idle">Press scan to analyse the current URL</div>
    </div>

  </div>

  <!-- Footer -->
  <div class="popup-footer">PhishRadar · XGBoost + XAI · Local API</div>

  <script src="popup.js"></script>
</body>
</html>
